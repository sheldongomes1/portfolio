[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillgate"
version = "0.3.1"
description = "Verification for AI skills: golden cases, repeated runs, binary judging, and receipts."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "anthropic>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skillgate = "skillgate.cli:main"

[tool.setuptools]
packages = ["skillgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls a real model API; opt in with SKILLGATE_LIVE=1"]
