# Example project: a tiny, fictional refund-triage skill with hand-written outputs.
# Every check here is deterministic, so this example runs without any API key.
skill:
  name: refund-triage
  path: skill/skill.md
  references:
    - skill/reference/*.md
paths:
  cases: golden/cases
  golden: golden/golden.yaml
  criteria: golden/criteria.yaml
  runs: runs
  receipts: receipts
  reports: reports
judge:
  provider: anthropic
  model: claude-opus-5
  settings:
    effort: high
    max_tokens: 16000
repeats: 2
pricing:
  claude-opus-5: {input_per_mtok: 5.00, output_per_mtok: 25.00}
